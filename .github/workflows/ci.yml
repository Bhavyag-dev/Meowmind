name: CI — Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript type check + unit tests (fast, runs on Linux)
  # ---------------------------------------------------------------------------
  test:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test

  # ---------------------------------------------------------------------------
  # macOS build — universal binary (Apple Silicon + Intel)
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install macOS dependencies
        run: |
          brew install pkg-config

      - name: Install npm dependencies
        run: npm ci

      - name: Cargo test (native)
        run: cd src-tauri && cargo test

      - name: Build universal macOS app
        run: npm run tauri build -- --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meowmind-macos
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows build — x64
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install npm dependencies
        run: npm ci

      - name: Cargo test
        run: cd src-tauri && cargo test

      - name: Build Windows app
        run: npm run tauri build -- --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meowmind-windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Release — attach artifacts to GitHub release
  # ---------------------------------------------------------------------------
  release:
    name: Attach Release Artifacts
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]
    if: github.event_name == 'release'
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: meowmind-macos
          path: ./release/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: meowmind-windows
          path: ./release/windows

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/*.dmg
            release/windows/*.exe
            release/windows/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
